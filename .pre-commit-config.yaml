# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  # Os mesmos checks dos workflows prettier.yml e icones.yml, em poucos segundos.
  # Pedem `npm ci` e `uv` instalados antes.
  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: subconjunto-icones
        name: fontes de ícone em dia
        entry: uv run bin/subconjunto-icones.py --check
        language: system
        pass_filenames: false
        always_run: true
